<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Windows Security</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,sans-serif;user-select:none}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;cursor:default}
#change-img{position:fixed;bottom:8px;right:8px;z-index:0;opacity:0;width:40px;height:40px;cursor:pointer;font-size:20px;background:transparent;border:none}
.popup{position:fixed;width:400px;background:#1e1e1e;border:1px solid #444;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:10;color:#e0e0e0;opacity:0;transform:scale(.9);transition:opacity .3s,transform .3s}
.popup.show{opacity:1;transform:scale(1)}
.popup .titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#2d2d2d;border-radius:8px 8px 0 0;border-bottom:1px solid #444;font-size:13px;font-weight:600;cursor:move}
.popup .body{padding:16px 18px;font-size:13px;line-height:1.6}
.popup .actions{padding:10px 18px 16px;text-align:right}
.popup .actions button{background:#0078d4;color:#fff;border:none;padding:8px 20px;border-radius:4px;font-size:13px;cursor:pointer;font-weight:600}
.popup .actions button:hover{background:#1a86d9}
.popup .close{position:absolute;top:8px;right:12px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px;font-size:16px;color:#999;background:transparent;border:none}
.popup .close:hover{background:#c42b1c;color:#fff}
</style>
</head>
<body>
<img id="bg" src="" alt="">
<button id="change-img" title="Trocar imagem">.</button>
<input type="file" id="file-input" accept="image/*" style="display:none">
<script src="prank-script.js"></script>
</body>
</html>
